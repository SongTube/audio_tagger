group 'com.example.audio_tagger'
version '1.0'

// jaudiotagger is only published on JitPack, and the consuming app resolves this
// plugin's transitive dependencies against *its own* repository list. A plain
// `repositories` block here covers only this project, so the app build fails
// with "Could not find com.github.AdrienPoupa:jaudiotagger". Register the
// repository on every project in the build instead.
//
// Apps that lock repositories down with
// `repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)` must add
// `maven { url = uri("https://jitpack.io") }` to their own settings.gradle.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.audio_tagger'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // Was 16. Flutter's own floor is 24.
        minSdk 24
    }

    lint {
        // Don't fail a consumer's build over lint findings in this library.
        abortOnError false
    }
}

dependencies {
    implementation 'com.github.AdrienPoupa:jaudiotagger:2.2.3'
}
